# JasperReports 4.5.1 ships an old Eclipse JDT compiler that cannot compile
# expressions on JDK 9+ ("java.lang.String cannot be resolved"). Use the
# external javac compiler instead; start.bat/start.sh put the selected JDK's
# bin directory on PATH, so the same file works on JDK 8 and JDK 17 LTS.
net.sf.jasperreports.compiler.java=net.sf.jasperreports.engine.design.JRJavacCompiler
